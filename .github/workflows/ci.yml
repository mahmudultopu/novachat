name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novachat
          POSTGRES_PASSWORD: novachat
          POSTGRES_DB: novachat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novachat" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
        env:
          NOVACHAT_TEST_DATABASE_URL: postgres://novachat:novachat@localhost:5432/novachat_test?sslmode=disable
          NOVACHAT_TEST_REDIS_URL: redis://localhost:6379/15

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # CI builds point at the online test server, so the APK works on any phone.
      - run: ./gradlew assembleDebug --stacktrace -Pnovachat.serverUrl=https://novachat-5aj6.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: novachat-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # Every merge to main publishes the app as a direct download:
  # https://github.com/mahmudultopu/novachat/releases/download/latest/novachat.apk
  publish-apk:
    name: Publish test APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: novachat-debug-apk
      - run: |
          mv *.apk novachat.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest novachat.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NovaChat test build" \
            --notes "Latest test build from main ($GITHUB_SHA). Open this page on your Android phone and tap novachat.apk to install."
        env:
          GH_TOKEN: ${{ github.token }}
